[package]
name = "moviebox-web"
version = "0.1.0"
edition = "2024"
description = "TUI-styled web interface for MovieBox-TUI with mamamiakoi gate, live streaming, downloads, and auto-update scheduler."

[dependencies]
moviebox-tui = { path = "../MovieBox-TUI" }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
futures = "0.3"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
url = "2.5"
percent-encoding = "2.3"
log = "0.4"
env_logger = "0.11"
bytes = "1.10"
time = "0.3"

