name: Auto-Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Daily Sync MovieBox-TUI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy MovieBox-Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: MovieBox-Worker

